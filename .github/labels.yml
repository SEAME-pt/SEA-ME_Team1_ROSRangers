# Repository labels. Apply with scripts/sync-labels.sh.
#
# Labels answer "what kind of work" and "who owns it".
# Sprint, phase and board status are fields on the GitHub Project, not labels.

# --- Type (one per issue) ---
- name: "type: task"
  color: "1d76db"
  description: "Feature or implementation work"
- name: "type: bug"
  color: "d73a4a"
  description: "Software or configuration defect"
- name: "type: incident"
  color: "b60205"
  description: "Crash, incident or hardware fault (Safety Rules #12)"
- name: "type: test"
  color: "0e8a16"
  description: "Bench, HIL or flight test session"
- name: "type: spike"
  color: "c5def5"
  description: "Time-boxed research or experiment"
- name: "type: docs"
  color: "0075ca"
  description: "Architecture document, reports, vault notes"
- name: "type: chore"
  color: "ededed"
  description: "Tooling, repo maintenance, refactors"

# --- Track (Team Tracks) ---
- name: "track: A flight-safety"
  color: "f9d0c4"
  description: "Betaflight, ELRS, failsafe, flight tests"
- name: "track: B embedded-link"
  color: "fef2c0"
  description: "ESP firmware, MSP, C++ protocol lib"
- name: "track: C ground-ros2"
  color: "c2e0c6"
  description: "flight_interface node, Python protocol, controller"
- name: "track: D ci-test"
  color: "bfdadc"
  description: "Workflows, coverage, SITL job, HIL runner"
- name: "track: E sim-gestures"
  color: "d4c5f9"
  description: "PX4 SITL/Gazebo, flow estimation, gestures"
- name: "track: shared"
  color: "e4e4e4"
  description: "Shared core or whole-team work"

# --- Priority (same scale as the vault) ---
- name: "P0 🔴"
  color: "b60205"
  description: "Blocking or safety-critical; do now"
- name: "P1 🟠"
  color: "ff9f1c"
  description: "Needed this sprint"
- name: "P2 🟡"
  color: "fbca04"
  description: "Normal; when capacity allows"

# --- Flags ---
- name: "safety-critical"
  color: "000000"
  description: "Touches failsafe, arming, override or power. Never cut."
- name: "deliverable"
  color: "5319e7"
  description: "Module deliverable or sprint demo item"
- name: "stretch"
  color: "cccccc"
  description: "Cut first if the sprint is late"
- name: "blocked"
  color: "e99695"
  description: "Waiting on something outside the team"
- name: "needs-instructor"
  color: "f7c6c7"
  description: "Open question for the instructors (Open Questions)"
- name: "props-off"
  color: "bfd4f2"
  description: "Bench work only; no propellers"
- name: "in-cage-flight"
  color: "0052cc"
  description: "Requires a flight in the netted cage with a safety pilot"
