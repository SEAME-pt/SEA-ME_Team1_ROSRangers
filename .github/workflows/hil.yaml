
name: hil

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: hil-bench
  cancel-in-progress: false

jobs:
  check-hil:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for HIL test files
        id: check
        shell: bash
        run: |
          if [[ -f drone/firmware/esp8266/platformio.ini ]] &&
             [[ -d drone/tests/hil ]] &&
             find drone/tests/hil -type f -name '*.py' -print -quit | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=hil skipped::needs drone/firmware/esp8266/platformio.ini and a test in drone/tests/hil"
          fi

  hil:
    needs: [check-hil]
    if: ${{ needs.check-hil.outputs.enabled == 'true' }}
    runs-on: [self-hosted, linux, ARM64, hil-drone]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install platformio pytest pyserial

      - name: Build firmware for OTA
        run: |
          . .venv/bin/activate
          pio run -d drone/firmware/esp8266 -e esp_ota
        env:
          SD_PSK: ${{ secrets.SD_PSK_HIL }}

      - name: Flash the bench ESP over the air
        run: |
          . .venv/bin/activate
          pio run -d drone/firmware/esp8266 -e esp_ota -t upload

      - name: Bench tests (no battery, no props)
        run: |
          . .venv/bin/activate
          pytest drone/tests/hil -v --junitxml=hil-report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-report
          path: hil-report.xml
          if-no-files-found: ignore
