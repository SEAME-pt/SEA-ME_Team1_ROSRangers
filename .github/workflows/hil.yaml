name: hil

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: hil-bench
  cancel-in-progress: false

jobs:
  check-hil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for HIL test files
        id: check
        shell: bash
        run: |
          if [[ -f drone/firmware/esp8266/platformio.ini ]] &&
             [[ -d drone/tests/hil ]] &&
             find drone/tests/hil -type f -name '*.py' -print -quit | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=hil skipped::needs drone/firmware/esp8266/platformio.ini and a test in drone/tests/hil"
          fi

  # Spare ESP on the Pi's USB, no FC (ADR-020 update 2026-10-22), so it is
  # flashed over USB, not OTA. It runs its own SoftAP name and passwords so
  # it can never be mistaken for the drone.
  hil:
    needs: [check-hil]
    if: ${{ needs.check-hil.outputs.enabled == 'true' }}
    runs-on: [self-hosted, linux, ARM64, hil-drone]
    timeout-minutes: 30
    env:
      HIL_ESP_PORT: /dev/hil-esp
      HIL_REQUIRED: "1"
      # Read by drone/firmware/esp8266/secrets.py on every pio run, the
      # upload included, so they are set for the whole job
      SEAME_AP_SSID: ${{ secrets.SEAME_AP_SSID_HIL }}
      SEAME_AP_PASS: ${{ secrets.SEAME_AP_PASS_HIL }}
      SEAME_OTA_PASS: ${{ secrets.SEAME_OTA_PASS_HIL }}
      # Protocol PSK (ADR-002): built into esp_gateway and used by the session
      # tests as the ground's key. The bridge envs ignore it.
      SEAME_PSK: ${{ secrets.SD_PSK_HIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the bench
        shell: bash
        run: |
          if [[ ! -e $HIL_ESP_PORT ]]; then
            echo "::error title=HIL bench::$HIL_ESP_PORT not found. Is the spare ESP plugged into the Pi?"
            exit 1
          fi
          if [[ -z $SEAME_AP_SSID ]]; then
            echo "::error title=HIL bench::secret SEAME_AP_SSID_HIL is empty: the spare ESP would start a SoftAP with no name"
            exit 1
          fi

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install "platformio==6.1.*" "pytest==9.2.*" "pyserial==3.5"

      - name: Build firmware
        run: |
          . .venv/bin/activate
          pio run -d drone/firmware/esp8266 -e esp

      - name: Flash the spare ESP over USB
        run: |
          . .venv/bin/activate
          # No -t nobuild: it skips the Arduino build script that puts the
          # LD script on LIBPATH, and the esptool upload needs it for the
          # flash size ("Could not find LD script"). The build above is
          # reused, so nothing is recompiled.
          pio run -d drone/firmware/esp8266 -e esp -t upload --upload-port "$HIL_ESP_PORT"

      - name: Bench tests (no battery, no props)
        run: |
          . .venv/bin/activate
          # The window script's self-test runs in PR CI (ci.yaml), not here
          pytest drone/tests/hil -v --ignore=drone/tests/hil/wifi --ignore=drone/tests/hil/gateway \
            --ignore=drone/tests/hil/test_softap_window.py --junitxml=hil-report.xml

      # The Pi's only Wi-Fi radio leaves the lab network for this step, so
      # the runner is offline: under 2 min in total (ADR-020 update
      # 2026-10-26). A watchdog outside the job re-joins the lab Wi-Fi if the
      # job dies inside the window.
      - name: Wi-Fi tests on the spare ESP's SoftAP (offline window)
        timeout-minutes: 4
        run: |
          . .venv/bin/activate
          # exec: a cancel or step timeout signals the step's shell, so the
          # script must be that shell to restore the lab Wi-Fi at once
          exec drone/tests/hil/softap_window.sh 50 -- \
            pytest drone/tests/hil/wifi -v --junitxml=hil-wifi-report.xml

      # The gateway (#101) after the bridge: the bridge stays env esp until
      # the gateway passes these, so both are tested on every push
      - name: Build and flash the gateway over USB
        run: |
          . .venv/bin/activate
          pio run -d drone/firmware/esp8266 -e esp_gateway_usb -t upload --upload-port "$HIL_ESP_PORT"

      - name: Gateway tests on the FC's UART (Pi plays the FC)
        run: |
          . .venv/bin/activate
          pytest drone/tests/hil/gateway -v --ignore=drone/tests/hil/gateway/wifi \
            --junitxml=hil-gateway-report.xml

      # Second offline window, also under 2 min (ADR-020 update 2026-10-26)
      - name: Gateway Wi-Fi tests on the SoftAP (offline window)
        timeout-minutes: 4
        run: |
          . .venv/bin/activate
          exec drone/tests/hil/softap_window.sh 50 -- \
            pytest drone/tests/hil/gateway/wifi -v --junitxml=hil-gateway-wifi-report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-report
          path: hil-*report.xml
          if-no-files-found: ignore
