name: close-linked-issues

# GitHub only auto-closes linked issues when a PR merges into the default
# branch (main). Our PRs target dev (ADR-017), so close them here instead.

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // "Closes #N", "Fixes #N", "Resolves #N" in the description. "Refs #N" is ignored.
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const numbers = new Set([...(pr.body || '').matchAll(keyword)].map(m => Number(m[1])));

            // Issues linked in the PR's Development sidebar.
            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $pr: Int!) {
                 repository(owner: $owner, name: $repo) {
                   pullRequest(number: $pr) { closingIssuesReferences(first: 25) { nodes { number } } }
                 }
               }`,
              { ...context.repo, pr: pr.number },
            );
            repository.pullRequest.closingIssuesReferences.nodes.forEach(n => numbers.add(n.number));

            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') {
                core.info(`#${issue_number}: skipped (${issue.pull_request ? 'pull request' : 'already closed'})`);
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Closed by #${pr.number} (merged into \`dev\`).`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed', state_reason: 'completed' });
              core.info(`#${issue_number}: closed`);
            }
            if (numbers.size === 0) core.notice('No linked issues to close.');
