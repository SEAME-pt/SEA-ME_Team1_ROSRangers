
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  check-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.check.outputs.cpp }}
      python: ${{ steps.check.outputs.python }}
      esp: ${{ steps.check.outputs.esp }}
      sitl: ${{ steps.check.outputs.sitl }}
      ros: ${{ steps.check.outputs.ros }}
      ros_pkgs: ${{ steps.check.outputs.ros_pkgs }}
      docker: ${{ steps.check.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, HEAD is GitHub's merge commit and HEAD^1 the base branch,
          # so `git diff HEAD^1 HEAD` lists the files the PR changes
          fetch-depth: 2

      - name: Detect available components
        id: check
        shell: bash
        run: |
          if [[ -f drone/lib/protocol/CMakeLists.txt ]]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "cpp=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=protocol-cpp skipped::drone/lib/protocol/CMakeLists.txt not found"
          fi

          if [[ -f drone/ground/src/sd_protocol_py/pyproject.toml ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ground-python skipped::drone/ground/src/sd_protocol_py/pyproject.toml not found"
          fi

          if [[ -f drone/firmware/esp8266/platformio.ini ]]; then
            echo "esp=true" >> "$GITHUB_OUTPUT"
          else
            echo "esp=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=esp-firmware skipped::drone/firmware/esp8266/platformio.ini not found"
          fi

          if [[ -f drone/lib/protocol/CMakeLists.txt &&
                -f drone/ground/src/sd_protocol_py/pyproject.toml &&
                -d drone/tests/sitl ]] &&
             find drone/tests/sitl -type f -name '*.py' -print -quit | grep -q .; then
            echo "sitl=true" >> "$GITHUB_OUTPUT"
          else
            echo "sitl=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=betaflight-sitl skipped::needs the C++ lib, the Python package and a test in drone/tests/sitl"
          fi

          # The two slow ground jobs run on a PR only when it touches the ground
          # code or this workflow. Pushes to dev/main always run them. Filtering
          # here and not in `on: paths` keeps required checks working: a job
          # skipped by `if:` counts as passed, a workflow never started does not.
          ground_changed=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if ! grep -qE '^(drone/ground/|drone/tests/ros/|\.github/workflows/ci\.yaml$)' <<<"$changed"; then
              ground_changed=false
            fi
          fi

          if [[ ! -f drone/ground/src/gesture_node/package.xml ||
                ! -f drone/ground/src/intent_node/package.xml ]]; then
            echo "ros=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ground-ros2 skipped::gesture_node or intent_node package.xml not found"
          elif [[ $ground_changed == false ]]; then
            echo "ros=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ground-ros2 skipped::PR changes nothing in drone/ground, drone/tests/ros or ci.yaml"
          else
            echo "ros=true" >> "$GITHUB_OUTPUT"
          fi

          # Packages ground-ros2 builds and tests. gesture_node + intent_node
          # decide whether the job runs; mission_node joins once it exists.
          ros_pkgs="gesture_node intent_node"
          if [[ -f drone/ground/src/mission_node/package.xml ]]; then
            ros_pkgs+=" mission_node"
          else
            echo "::notice title=ground-ros2 without mission_node::drone/ground/src/mission_node/package.xml not found"
          fi
          echo "ros_pkgs=$ros_pkgs" >> "$GITHUB_OUTPUT"

          if [[ ! -f drone/ground/docker-compose.yml ]]; then
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ground-docker skipped::drone/ground/docker-compose.yml not found"
          elif [[ $ground_changed == false ]]; then
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ground-docker skipped::PR changes nothing in drone/ground, drone/tests/ros or ci.yaml"
          else
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

  protocol-cpp:
    needs: [lint, check-components]
    if: ${{ needs.check-components.outputs.cpp == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtest-dev gcovr clang-tidy cppcheck

      - name: Configure
        run: cmake -S drone/lib/protocol -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSD_COVERAGE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage gate
        run: gcovr -r drone/lib/protocol build --filter drone/lib/protocol/src --fail-under-line 80 --xml-pretty -o coverage.xml

      - name: Static analysis
        run: |
          clang-tidy -p build $(git ls-files 'drone/lib/protocol/src/*.cpp') --warnings-as-errors='*'
          cppcheck --enable=warning,style,performance --error-exitcode=1 --inline-suppr drone/lib/protocol/src drone/lib/protocol/include

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp
          path: coverage.xml

  ground-python:
    needs: [lint, check-components]
    if: ${{ needs.check-components.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - run: pip install -e drone/ground/src/sd_protocol_py
      - run: pytest drone/ground/src/sd_protocol_py --cov=sd_protocol --cov-fail-under=80

  # gesture_node + intent_node, plus mission_node once its package.xml exists
  # (list in check-components ros_pkgs): unit, node, launch and pipeline tests
  # in the ros:jazzy container (ADR-018). REQUIRE_ROS_TESTS makes a missing
  # rclpy or package fail instead of skipping the ROS tests.
  ground-ros2:
    needs: [lint, check-components]
    if: ${{ needs.check-components.outputs.ros == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ros:jazzy-ros-base
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      REQUIRE_ROS_TESTS: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_PKGS: ${{ needs.check-components.outputs.ros_pkgs }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-pytest python3-pytest-cov libgl1 libegl1 libglib2.0-0
          pip3 install -r drone/ground/src/gesture_node/requirements.txt

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths drone/ground/src --packages-select $ROS_PKGS

      # The packages' tests the way ROS runs them (writes build/<pkg>/pytest.xml)
      - name: Package tests (unit + node)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --base-paths drone/ground/src --packages-select $ROS_PKGS \
            --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose

      # Once more with the pipeline tests, measured against the installed
      # packages. pytest-cov also counts the tests that start a node as a
      # subprocess.
      - name: Coverage gate (package + pipeline tests)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          test_paths=() cov_flags=()
          for pkg in $ROS_PKGS; do
            test_paths+=("drone/ground/src/$pkg/test")
            cov_flags+=("--cov=$pkg")
          done
          python3 -m pytest "${test_paths[@]}" drone/tests/ros \
            "${cov_flags[@]}" --cov-report=term-missing --cov-fail-under=90 \
            --junitxml=ground-ros2-report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-ros2-report
          path: |
            ground-ros2-report.xml
            build/*/pytest.xml
          if-no-files-found: ignore

  # Docker images build, and the intent container turns INDEX_RIGHT into MOVE_RIGHT
  ground-docker:
    needs: [lint, check-components]
    if: ${{ needs.check-components.outputs.docker == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: drone/ground/docker/smoke_test.sh

  esp-firmware:
    needs: [lint, check-components]
    if: ${{ needs.check-components.outputs.esp == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build ESP8266 firmware
        # the diagnostic envs too, so a broken diag build fails the PR (same cache)
        run: pio run -d drone/firmware/esp8266 -e esp -e esp_diag_timing -e esp_diag_tcp -e esp_diag_wdt -e esp_diag_udp -e esp_diag_uart
        env: # build-only dummies, read by drone/firmware/esp8266/secrets.py
          SEAME_AP_SSID: ci-dummy-ssid
          SEAME_AP_PASS: ci-dummy-pass
          SEAME_OTA_PASS: ci-dummy-pass
      - uses: actions/upload-artifact@v4
        with:
          name: esp-firmware
          path: drone/firmware/esp8266/.pio/build/esp/firmware.bin

  check-sitl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check SITL prerequisites
        id: check
        shell: bash
        run: |
          if [[ -f drone/lib/protocol/CMakeLists.txt &&
                -f drone/ground/src/sd_protocol_py/pyproject.toml &&
                -d drone/tests/sitl ]] &&
            find drone/tests/sitl -type f -name '*.py' -print -quit | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  betaflight-sitl:
    needs: [lint, protocol-cpp, ground-python, check-components]
    if: >-
      ${{
        !cancelled() &&
        needs.lint.result == 'success' &&
        needs.protocol-cpp.result == 'success' &&
        needs.ground-python.result == 'success' &&
        needs.check-components.outputs.sitl == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Betaflight SITL
        run: |
          git clone --depth 1 --branch 2026.6.2 https://github.com/betaflight/betaflight.git bf
          # Fetch submodules first: make -j hydrates them in parallel and the
          # jobs race for bf/.git/config ("could not lock config file")
          git -C bf submodule update --init --recursive --depth 1
          mkdir -p shim
          printf '#!/bin/sh\n[ "$1" = "-dumpversion" ] && echo 13.3.1 && exit 0\nexit 1\n' > shim/arm-none-eabi-gcc
          chmod +x shim/arm-none-eabi-gcc
          PATH="$PWD/shim:$PATH" make -C bf TARGET=SITL -j"$(nproc)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest
      - run: pip install -e drone/ground/src/sd_protocol_py

      - name: MSP integration tests against SITL
        env:
          SITL_REQUIRED: "1"
        run: |
          (cd bf && ./obj/main/betaflight_SITL.elf > ../sitl.log 2>&1 &)
          # conftest.py waits for TCP 5761 and an MSP answer, up to 60 s
          pytest drone/tests/sitl -v

      - name: Upload SITL log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-sitl-log
          path: sitl.log
          if-no-files-found: warn
