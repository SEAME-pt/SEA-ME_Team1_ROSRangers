[platformio]
default_envs = esp

[env]
platform = espressif8266@4.2.1   ; Arduino core 3.1.2 (ADR-007)
board = esp12e ; PlatformIO board ID for our ESP-12F module (4 MB), not an env name
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
build_type = debug ; keeps the symbols the exception decoder needs
extra_scripts = pre:secrets.py
; the bridge and diag envs build src/main.cpp; the gateway (#101) has its own
; folder and its own envs (esp, esp_ota)
build_src_filter = +<*> -<gateway/>

; gateway firmware (#101, #102), the default since #106: allow-listed FC link
; and the ESP Link State Machine (TCP/UDP 5759). Uses the protocol library
; (drone/lib/protocol). Needs the PSK (SEAME_PSK or "psk" in secrets.json, see
; secrets.py). First flash and recovery: ESP on USB, disconnected from the FC
; (ADR-012). The HIL bench flashes its spare ESP with this env (hil.yaml)
[env:esp]
build_src_filter = +<gateway/>
lib_deps = symlink://../../lib/protocol
upload_speed = 460800

; every later update of the gateway: over Wi-Fi, battery connected, props off,
; FC disarmed, no ground session (ADR-024)
[env:esp_ota]
extends = env:esp
upload_protocol = espota
upload_port = 192.168.4.1

; transparent UART<->UDP bridge (src/main.cpp), the default until #106. Kept
; for the diag envs below and as a way back
[env:esp_bridge]
upload_speed = 460800

[env:esp_bridge_ota]
upload_protocol = espota
upload_port = 192.168.4.1

; bench diagnosis of the Wi-Fi latency, over USB only (see WITH_* in main.cpp)
[env:esp_diag_udp]
build_flags = -DWITH_UART=0

[env:esp_diag_uart]
build_flags = -DWITH_UDP=0

; timestamps per request on UDP 5770 (WITH_TIMING in main.cpp). Over Wi-Fi,
; as the ESP is soldered to the FC. Flash env esp_ota (the gateway) back after the diagnosis
[env:esp_diag_timing]
build_flags = -DWITH_TIMING=1
upload_protocol = espota
upload_port = 192.168.4.1

; S1-07: TCP echo server on TCP 5759 next to the bridge, plus the timestamps
[env:esp_diag_tcp]
build_flags = -DWITH_TCP_ECHO=1 -DWITH_TIMING=1
upload_protocol = espota
upload_port = 192.168.4.1

; S1-10: hangs on command (UDP 5771) so the watchdog resets the ESP
[env:esp_diag_wdt]
build_flags = -DWITH_WDT_TEST=1
upload_protocol = espota
upload_port = 192.168.4.1
