[platformio]
default_envs = esp

[env]
platform = espressif8266@4.2.1   ; Arduino core 3.1.2 (ADR-007)
board = esp12e ; PlatformIO board ID for our ESP-12F module (4 MB), not an env name
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
build_type = debug ; keeps the symbols the exception decoder needs
extra_scripts = pre:secrets.py

; first flash and recovery: ESP on USB, disconnected from the FC (ADR-012)
[env:esp]
upload_speed = 460800

; bench diagnosis of the Wi-Fi latency, over USB only (see WITH_* in main.cpp)
[env:esp_diag_udp]
build_flags = -DWITH_UART=0

[env:esp_diag_uart]
build_flags = -DWITH_UDP=0

; every later update: over Wi-Fi, props off, no battery
[env:esp_ota]
upload_protocol = espota
upload_port = 192.168.4.1

; timestamps per request on UDP 5761 (WITH_TIMING in main.cpp). Over Wi-Fi,
; as the ESP is soldered to the FC. Flash env esp_ota back after the diagnosis
[env:esp_diag_timing]
build_flags = -DWITH_TIMING=1
upload_protocol = espota
upload_port = 192.168.4.1

; S1-07: TCP echo server on 5762 next to the bridge, plus the timestamps
[env:esp_diag_tcp]
build_flags = -DWITH_TCP_ECHO=1 -DWITH_TIMING=1
upload_protocol = espota
upload_port = 192.168.4.1

; S1-10: hangs on command (UDP 5763) so the watchdog resets the ESP
[env:esp_diag_wdt]
build_flags = -DWITH_WDT_TEST=1
upload_protocol = espota
upload_port = 192.168.4.1
