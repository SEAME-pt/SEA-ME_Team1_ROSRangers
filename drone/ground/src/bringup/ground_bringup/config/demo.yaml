# Demo mode: make (docker compose), or ros2 launch ground_bringup demo.launch.py.
# gesture -> intent -> mission, with a PRETEND /flight/state (fake_flight_state).
# Never with a real drone.
#
# Only the values this mode sets; every other parameter keeps the default its
# node declares. Each key must be a parameter its node declares
# (test/test_config.py checks it).
#
# The containers read this file from the source folder (mounted read-only at
# /config): edit it, then restart the container (docker compose restart flight).
# The mask is set in every node that declares it, with the same value
# (ADR-025 F15, test/test_config.py checks it). No `/**:` section: it would
# stop a `-p` on the command line from overriding a node's own value.

intent_node:
  ros__parameters:
    input_source: topic   # gesture_node's /gesture/raw, not UDP

fake_flight_state:
  ros__parameters:
    mask: 11          # axes the ground owns: 8 yaw, 11 x y yaw, 15 all (throttle too)
    airborne: true    # false: the pretend drone is on the ground, land requests are ignored
