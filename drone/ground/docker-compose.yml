# One container per node: gesture_node -> /gesture/raw -> intent_node ->
# /gesture/intent -> mission_node (with a pretend /flight/state) ->
# /mission/velocity_target + /mission/state, all shown by echo. No local Jazzy, OpenCV or
# MediaPipe needed. Linux host with a webcam and X11 (Wayland with XWayland
# works too).
#
# Run from drone/ground/:
#   xhost +local:                          # once per login: lets gesture open its window
#   docker compose up --build              # all of them: the live table here, each
#                                          # node's output in logs/<service>/latest.log
# or one per terminal:
#   docker compose up --build gesture      # terminal 1: camera + "Gestures" window (q to quit)
#   docker compose up --build intent       # terminal 2: filter -> /gesture/intent
#   docker compose run --rm --build echo   # terminal 3: live table (gesture, intent, mode, velocity)
#   docker compose up --build mission flight  # terminal 4: mode changes in the log
#   docker compose down                    # stop everything
# flight_interface (the real /flight/state, #103) has its own profile and is
# never started by these: see its service below.
# PX4 SITL instead of the pretend /flight/state (simulation only): make sim,
# make sim-smoke, make sim-down (Makefile; services px4 and sim_smoke below).
#
# Logs: every node (not echo) writes logs/<service>/<start time>.log, one file
# per run, every line timestamped; logs/<service>/latest.log is the newest.
# Compare two runs:  diff logs/mission/2026-10-23_10-00-00.log logs/mission/latest.log
# Follow one live:   tail -f logs/mission/latest.log   (or docker compose logs -f mission)
# GROUND_LOG_DIR=./other  puts them somewhere else (the smoke test uses ./logs/smoke).
#
# ROS traffic stays on this PC (decision E1 of #103): ROS_DOMAIN_ID 42 (the
# team domain) and ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST unless you set them.
# A host terminal that talks to these nodes needs the same:
#   export ROS_DOMAIN_ID=42 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST

# Shared by every service. Build context is this folder so the Dockerfiles
# (src/<component>/Dockerfile) can COPY src/ and docker/entrypoint.sh.
# The ground images build FROM base (docker/base/Dockerfile, the `base`
# service below): ROS 2 Jazzy and the non-root user `ros`, with the host
# user's uid and gid (GROUND_UID / GROUND_GID, set by the Makefile; 1000 by
# default), so logs/ stays the host user's.
x-ros: &ros
  network_mode: host   # DDS discovery between containers (and with a host ROS install)
  ipc: host            # Fast DDS shared-memory transport
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    - ROS_AUTOMATIC_DISCOVERY_RANGE=${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
  volumes:
    - /etc/localtime:/etc/localtime:ro   # host time zone in logs and the table

# The ground images build FROM base: depends_on makes compose build it first
# also for one service (docker compose up --build gesture), and run it (it
# only runs `true`) before the service starts.
x-after-base: &after-base
  base:
    condition: service_completed_successfully

# Parameters: the mode's file from ground_bringup (config/<mode>.yaml),
# mounted read-only at /config from the source folder, so an edit applies on
# the next restart without a rebuild. GROUND_MODE picks the file (demo by
# default). No parameter is set here.
#
# The nodes: output to logs/<service>/ (docker/entrypoint.sh), not to the
# `docker compose up` terminal, which only shows echo's table.
x-node: &node
  <<: *ros
  attach: false
  environment: &node-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    LOG_DIR: /logs
    PYTHONUNBUFFERED: "1"   # print() lines reach the log at once
    # The log lines already carry the time (entrypoint.sh)
    RCUTILS_CONSOLE_OUTPUT_FORMAT: "[{severity}] [{name}]: {message}"
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - ${GROUND_LOG_DIR:-./logs}:/logs
    - ./src/bringup/ground_bringup/config:/config:ro

services:
  # Every ground image gets it as the build context `base`
  # (additional_contexts) and depends on it (x-after-base), so compose builds
  # it first. Neither a profile nor scale 0: compose then refuses it as a
  # build context. Starting it only runs `true`, with nothing shown.
  base:
    attach: false
    restart: "no"
    command: ["true"]
    build:
      context: .
      dockerfile: docker/base/Dockerfile
      args:
        GROUND_UID: ${GROUND_UID:-1000}
        GROUND_GID: ${GROUND_GID:-1000}
    image: rosrangers/ground-base:jazzy

  gesture:
    <<: *node
    build:
      context: .
      dockerfile: src/gesture/Dockerfile
      additional_contexts:
        base: service:base
    depends_on: *after-base
    image: rosrangers/gesture:jazzy
    devices:
      - /dev/video0:/dev/video0
      - /dev/dri:/dev/dri   # GPU for the OpenGL (libGL/EGL) the window and MediaPipe use
    # The user `ros` is in the image's video group (the camera). The GPU's
    # render node belongs to the host's render group: the Makefile sets
    # RENDER_GID from /dev/dri/renderD128 (without it, software OpenGL).
    group_add:
      - "${RENDER_GID:-video}"
    environment:
      <<: *node-env
      LOG_NAME: gesture
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${GROUND_LOG_DIR:-./logs}:/logs
      - ./src/bringup/ground_bringup/config:/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - /ws/install/gesture_node/lib/gesture_node/gesture_node
      - --ros-args
      - --params-file
      - /config/${GROUND_MODE:-demo}.yaml

  intent:
    <<: *node
    build:
      context: .
      dockerfile: src/intent/Dockerfile
      additional_contexts:
        base: service:base
    depends_on: *after-base
    image: rosrangers/intent:jazzy
    environment:
      <<: *node-env
      LOG_NAME: intent
    command:
      - /ws/install/intent_node/lib/intent_node/intent_node
      - --ros-args
      - --params-file
      - /config/${GROUND_MODE:-demo}.yaml

  mission:
    <<: *node
    build:
      context: .
      dockerfile: src/mission/Dockerfile
      additional_contexts:
        base: service:base
    depends_on: *after-base
    image: rosrangers/mission:jazzy
    environment:
      <<: *node-env
      LOG_NAME: mission
    command:
      - /ws/install/mission_node/lib/mission_node/mission_node
      - --ros-args
      - --params-file
      - /config/${GROUND_MODE:-demo}.yaml

  # PRETEND /flight/state (override on, airborne) so mission can leave IDLE.
  # Never use it with a real drone. Its mask and airborne are in
  # config/demo.yaml (ground_bringup): mask 15 gives the ground throttle
  # (climb / descend); airborne false puts it on the ground, where land
  # requests are ignored. Edit, then: docker compose restart flight
  flight:
    <<: *node
    build:
      context: .
      dockerfile: src/mission/Dockerfile
      additional_contexts:
        base: service:base
    depends_on: *after-base
    image: rosrangers/mission:jazzy
    environment:
      <<: *node-env
      LOG_NAME: flight
    command:
      - /ws/install/mission_node/lib/mission_node/fake_flight_state
      - --ros-args
      - --params-file
      - /config/demo.yaml   # demo only, whatever GROUND_MODE says

  echo:
    <<: *ros
    build:
      context: .
      dockerfile: src/echo/Dockerfile
      additional_contexts:
        base: service:base
    depends_on: *after-base
    image: rosrangers/echo:jazzy
    tty: true   # the live table, also inside `docker compose up`

  # The real /flight/state (#103, ADR-025). Its own profile, so `docker compose
  # up` (make) never starts it next to `flight`: /flight/state must have one
  # publisher. Starts unconfigured with the loopback backend; the drone needs
  #   docker compose --profile flight_interface run --rm flight_interface \
  #     /ws/install/flight_interface/lib/flight_interface/flight_interface \
  #     --ros-args -p backend:=esp
  # Configure, activate and ARM are operator steps (ros2 lifecycle / service).
  # No restart (A6): a dead node stays dead, the ESP's failsafe takes over.
  # While it runs, make, make sim and make sim-smoke refuse to start: each
  # would add a second /flight/state publisher.
  # The PSK: ~/.config/seame-drone/psk.json, which holds only the PSK
  # (make psk-file writes it from secrets.json), mounted read-only where the
  # node looks for secrets.json. Never the whole secrets.json (it also holds
  # the Wi-Fi and OTA passwords), never SEAME_PSK in the environment, never
  # in the image (ADR-025 E3, E3.2). A missing file is an error, not an empty
  # folder. SEAME_SECRETS_FILE=path mounts another file. The file is bound by
  # inode: after make psk-file changes the PSK, recreate the container.
  flight_interface:
    <<: *node
    profiles: [flight_interface]
    restart: "no"
    build:
      context: .
      dockerfile: src/flight_interface/Dockerfile
      additional_contexts:
        base: service:base
    depends_on: *after-base
    image: rosrangers/flight_interface:jazzy
    environment:
      <<: *node-env
      LOG_NAME: flight_interface
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${GROUND_LOG_DIR:-./logs}:/logs
      - type: bind
        source: ${SEAME_SECRETS_FILE:-${HOME}/.config/seame-drone/psk.json}
        target: /home/ros/.config/seame-drone/secrets.json
        read_only: true
        bind:
          create_host_path: false

  # ---------- SIMULATION ONLY (#86): make sim, make sim-smoke ----------
  # Profiles, so `docker compose up` (make) never starts them. The bridge
  # publishes /flight/state from PX4, so `flight` must not run with them (the
  # Makefile lists the services by name). Never use with the real drone.

  # PX4 SITL + Gazebo (headless) + Micro XRCE-DDS agent + px4_offboard_bridge.
  # src/simulation/sim_start.sh arms, takes off and switches to Offboard, then the
  # healthcheck turns healthy. MASK=8|11|15 (default 15; make sim-smoke takes
  # 11|15 only). GUI=1 opens Gazebo: the default here is 0, make sim passes 1
  # (its own default), so plain `docker compose --profile sim up` is headless.
  px4:
    <<: *node
    profiles: [sim, sim-smoke]
    build: &px4-build
      context: .
      dockerfile: src/simulation/Dockerfile
      # The PX4 stage comes from the image make px4-image builds. The Makefile
      # passes its PX4_IMAGE, so both always name the same image.
      args:
        PX4_IMAGE: ${PX4_IMAGE:-seame-px4-sim:jazzy-1.17}
    image: rosrangers/px4-sim:jazzy
    # GPU (Mesa) for Gazebo rendering. This image runs as uid 1000, so it also
    # needs the host's render group: the Makefile sets RENDER_GID from
    # /dev/dri/renderD128. Without access Mesa falls back to software (slow).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-0}"
    environment:
      <<: *node-env
      LOG_NAME: px4
      MASK: ${MASK:-15}
      GUI: ${GUI:-0}
      DISPLAY: ${DISPLAY:-:0}
      # This image's user (dev, uid 1000) and the ground images' user (ros,
      # the host's uid) can differ: Fast DDS shared memory between them can
      # drop messages, so UDP only.
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${GROUND_LOG_DIR:-./logs}:/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sim_ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 420s

  # The scripted scenario and its checks (smoke_scenario.py in
  # px4_offboard_bridge): its own intent_node, gestures on /gesture/raw, a
  # rosbag and summary.md in logs/sim-smoke/<start time>/.
  sim_smoke:
    <<: *node
    profiles: [sim-smoke]
    attach: true
    build: *px4-build
    image: rosrangers/px4-sim:jazzy
    depends_on:
      px4:
        condition: service_healthy
      mission:
        condition: service_started
    environment:
      <<: *node-env
      LOG_NAME: sim-smoke
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    command: ["/ws/install/px4_offboard_bridge/lib/px4_offboard_bridge/sim_smoke_scenario"]
