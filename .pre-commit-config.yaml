repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.0
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  # Golden vectors must match their independent generator (ADR-022 update 2026-11-23)
  - repo: local
    hooks:
      - id: golden-vectors
        name: golden vectors match generate.py
        entry: python3 drone/tests/vectors/generate.py --check
        language: system
        files: ^drone/tests/vectors/
        pass_filenames: false
